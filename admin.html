<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SokoHub Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --wa-green: #075E54;
            --wa-light-green: #25D366;
            --wa-bg: #ECE5DD;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 20px; background-color: var(--wa-bg); }
        h2, h3 { color: var(--wa-green); }
        button { background-color: var(--wa-light-green); border: none; padding: 10px 20px; border-radius: 20px; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #128C7E; }
        .form-group { margin-bottom: 15px; }
        input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; border-radius: 10px; overflow: hidden; }
        th, td { border: none; padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: var(--wa-green); color: white; }
        img { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>SokoHub Admin</h2>
    <div id="loginForm">
        <h3>Login</h3>
        <input type="email" id="email" placeholder="Email"><br>
        <input type="password" id="password" placeholder="Password"><br>
        <button id="loginBtn">Login</button>
    </div>

    <div id="adminPanel" style="display:none;">
        <h3>Add Product</h3>
        <div class="form-group"><label>Name:</label><input type="text" id="pName"></div>
        <div class="form-group"><label>Price:</label><input type="number" id="pPrice"></div>
        <div class="form-group"><label>Category:</label><input type="text" id="pCat"></div>
        <div class="form-group"><label>Product Images (Max 5):</label><input type="file" id="pImage" accept="image/*" multiple></div>
        <button id="addBtn">Add Product</button>
        <hr>
        <table id="productTable">
            <thead><tr><th>Images</th><th>Name</th><th>Price</th><th>Category</th><th>Action</th></tr></thead>
            <tbody id="productBody"></tbody>
        </table>
    </div>

    <script>
        const sb = supabase.createClient(
            'https://arlupdxkxqukxayqxxmj.supabase.co', 
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFybHVwZHhreHF1a3hheXF4eG1qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5OTI4OTgsImV4cCI6MjEwMjU2ODg5OH0.SkJewEi-Bo03rc_YpBtI-dY_hJYPXuZ8TSdmqkINhmo'
        );

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { data, error } = await sb.auth.signInWithPassword({ email, password });
            if (error) alert(error.message);
            else location.reload();
        }

        async function loadProducts() {
            const { data, error } = await sb.from('products').select('*');
            if (error) { console.error(error); return; }
            const body = document.getElementById('productBody');
            body.innerHTML = data.map(p => `
                <tr>
                    <td>${(p.image_urls || []).map(url => `<img src="${url}" style="width:30px; height:30px; margin-right:2px;">`).join('')}</td>
                    <td>${p.name}</td>
                    <td>${p.price}</td>
                    <td>${p.category}</td>
                    <td><button onclick="deleteProduct('${p.id}')">Delete</button></td>
                </tr>
            `).join('');
        }

        async function addProduct() {
            const files = document.getElementById('pImage').files;
            if (files.length === 0 || files.length > 5) { 
                alert('Please select between 1 and 5 images'); 
                return; 
            }

            let imageUrls = [];
            // Upload each image
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const fileName = `${Date.now()}_${i}_${file.name}`;
                const { data, error } = await sb.storage
                    .from('product-images')
                    .upload(fileName, file);
                
                if (error) { alert(error.message); return; }
                
                const { data: urlData } = sb.storage.from('product-images').getPublicUrl(fileName);
                imageUrls.push(urlData.publicUrl);
            }

            // Add to Database
            const { error: dbError } = await sb.from('products').insert([{
                name: document.getElementById('pName').value,
                price: document.getElementById('pPrice').value,
                category: document.getElementById('pCat').value,
                image_urls: imageUrls
            }]);
            
            if (dbError) alert(dbError.message);
            else {
                alert('Product added!');
                location.reload();
            }
        }

        async function deleteProduct(id) {
            await sb.from('products').delete().eq('id', id);
            loadProducts();
        }

        document.getElementById('loginBtn').addEventListener('click', login);
        document.getElementById('addBtn').addEventListener('click', addProduct);

        sb.auth.getSession().then(({ data }) => {
            if (data.session) {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                loadProducts();
            }
        });
    </script>
</body>
</html>
